<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkbox detection</title>
  <style>
    :root {
      color: #1c1b19;
      background: #f4f1ea;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body { margin: 0; }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.5rem; font-weight: 650; margin: 0 0 8px; }
    p { margin: 0; line-height: 1.45; }
    .lead { color: #4e4a43; max-width: 62ch; }
    .drop {
      margin-top: 24px;
      border: 1.5px dashed #b7b0a4;
      background: #fff;
      border-radius: 14px;
      padding: 36px 20px;
      text-align: center;
    }
    .drop.over { border-color: #2f6f54; background: #f3faf6; }
    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    .drop .pick {
      display: inline-block;
      margin-top: 12px;
      background: #2f6f54;
      color: white;
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
    }
    .modes { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 18px; }
    .modes label { display: flex; gap: 6px; align-items: center; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 16px; }
    .debug { display: flex; gap: 6px; align-items: center; }
    .actions button {
      border: 0;
      background: #24342c;
      color: white;
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
    }
    .actions button:disabled { opacity: 0.5; cursor: default; }
    .hint { color: #6b6560; font-size: 0.92rem; }
    .error { color: #8d2d2d; margin-top: 12px; }
    .result {
      display: none;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 20px;
      margin-top: 24px;
      align-items: stretch;
      height: calc(100vh - 230px);
      min-height: 480px;
    }
    .result.show { display: grid; }
    .thumb-wrap {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      background: white;
      border-radius: 12px;
      padding: 10px;
    }
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #eceae4;
    }
    .zoom {
      position: relative;
      height: 100%;
      transform-origin: 0 0;
    }
    .thumb-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #eceae4;
    }
    .overlay {
      position: absolute;
      pointer-events: none;
    }
    .overlay rect {
      fill: rgba(47, 111, 84, 0.2);
      stroke: #1f6b4a;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      pointer-events: visiblePainted;
      cursor: pointer;
    }
    .overlay rect.checked {
      fill: rgba(196, 122, 44, 0.35);
      stroke: #c47a2c;
    }
    .overlay rect.active {
      fill: rgba(226, 193, 74, 0.5);
      stroke: #f3e3a1;
      stroke-width: 3;
    }
    .pane-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }
    .pane-tools p { color: #6b6560; font-size: 0.85rem; }
    #maximize {
      border: 0;
      background: #24342c;
      color: white;
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
      flex: none;
    }
    body.maximized { overflow: hidden; }
    body.maximized main {
      max-width: none;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    body.maximized h1,
    body.maximized .lead,
    body.maximized .drop,
    body.maximized .modes,
    body.maximized .actions,
    body.maximized #error,
    body.maximized .pane-tools p { display: none; }
    body.maximized .result.show {
      flex: 1;
      height: auto;
      min-height: 0;
      margin: 0;
    }
    body.maximized .thumb-wrap { position: relative; }
    body.maximized #maximize {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 2;
    }
    body.maximized pre {
      font-size: 1.15rem;
      line-height: 1.55;
    }
    pre {
      position: relative;
      margin: 0;
      background: #1d2420;
      color: #f3f1ea;
      border-radius: 12px;
      padding: 16px;
      overflow: auto;
      height: 100%;
      min-height: 0;
      font-family: Consolas, ui-monospace, monospace;
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .json-box.active {
      background: rgba(226, 193, 74, 0.28);
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    @media (max-width: 800px) {
      .result { grid-template-columns: 1fr; height: auto; }
      .stage { height: 55vh; }
      pre { height: 45vh; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Checkbox detection</h1>
    <p class="lead">Drop a document image, pick a method, and read the boxes JSON next to the page.</p>
    <div id="drop" class="drop">
      <p>Drop an image here</p>
      <label class="pick" for="file">Choose a file</label>
      <input id="file" class="file-input" type="file" accept="image/*">
    </div>
    <div class="modes">
      <label><input type="radio" name="method" value="cv" checked> OpenCV</label>
      <label><input type="radio" name="method" value="llm"> Mock LLM</label>
      <label><input type="radio" name="method" value="local"> Local LLM</label>
    </div>
    <div class="actions">
      <button id="detect" type="button" disabled>Detect</button>
      <label class="debug"><input id="debug" type="checkbox"> Debug overlay</label>
      <span id="status" class="hint"></span>
    </div>
    <p id="error" class="error" hidden></p>
    <div id="result" class="result">
      <div class="thumb-wrap">
        <div class="stage" id="thumb-stage">
          <div class="zoom" id="thumb-zoom">
            <img id="thumb" alt="Dropped document">
            <svg id="thumb-overlay" class="overlay" aria-hidden="true"></svg>
          </div>
        </div>
        <div class="pane-tools">
          <p>With debug on, hover a box or its JSON. That checkbox stays zoomed beside its JSON.</p>
          <button id="maximize" type="button">Maximize</button>
        </div>
      </div>
      <pre id="json"></pre>
    </div>
  </main>
  <script>
    const drop = document.querySelector("#drop");
    const fileInput = document.querySelector("#file");
    const detectButton = document.querySelector("#detect");
    const status = document.querySelector("#status");
    const error = document.querySelector("#error");
    const result = document.querySelector("#result");
    const thumbStage = document.querySelector("#thumb-stage");
    const thumbZoom = document.querySelector("#thumb-zoom");
    const thumb = document.querySelector("#thumb");
    const thumbOverlay = document.querySelector("#thumb-overlay");
    const json = document.querySelector("#json");
    const debugInput = document.querySelector("#debug");
    const maximizeButton = document.querySelector("#maximize");
    let currentFile = null;
    let previewUrl = "";
    let boxes = [];
    let lastData = null;
    let activeIndex = null;

    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) useFile(fileInput.files[0]);
    });
    drop.addEventListener("dragover", (event) => {
      event.preventDefault();
      drop.classList.add("over");
    });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (event) => {
      event.preventDefault();
      drop.classList.remove("over");
      const file = event.dataTransfer.files[0];
      if (file) useFile(file);
    });
    detectButton.addEventListener("click", detect);
    debugInput.addEventListener("change", () => {
      activeIndex = null;
      thumbZoom.style.transform = "";
      renderJson();
      drawOverlays();
    });
    json.addEventListener("mouseover", (event) => {
      const entry = event.target.closest(".json-box");
      if (!entry || !debugInput.checked) return;
      setActive(Number(entry.dataset.index));
    });
    result.addEventListener("mouseleave", () => setActive(null));
    maximizeButton.addEventListener("click", toggleMaximized);
    thumbStage.addEventListener("click", (event) => {
      if (event.target.closest("rect")) return;
      toggleMaximized();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && document.body.classList.contains("maximized")) toggleMaximized();
    });
    thumb.addEventListener("load", drawOverlays);
    new ResizeObserver(drawOverlays).observe(thumbStage);

    function useFile(file) {
      if (!file.type.startsWith("image/")) {
        showError("Choose an image file.");
        return;
      }
      currentFile = file;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      thumb.src = previewUrl;
      result.classList.add("show");
      boxes = [];
      lastData = null;
      activeIndex = null;
      thumbZoom.style.transform = "";
      json.textContent = "";
      drawOverlays();
      detectButton.disabled = false;
      status.textContent = file.name;
      clearError();
    }

    async function detect() {
      if (!currentFile) return;
      detectButton.disabled = true;
      status.textContent = "Detecting…";
      clearError();
      const method = document.querySelector("input[name=method]:checked").value;
      const body = new FormData();
      body.append("image", currentFile);
      body.append("method", method);
      try {
        const response = await fetch("/detect", { method: "POST", body });
        const data = await response.json();
        if (!response.ok) {
          const detail = data.detail || response.statusText;
          throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
        }
        lastData = data;
        boxes = Array.isArray(data.boxes) ? data.boxes : [];
        activeIndex = null;
        renderJson();
        drawOverlays();
        status.textContent = currentFile.name;
      } catch (err) {
        lastData = null;
        boxes = [];
        json.textContent = "";
        drawOverlays();
        showError(err.message || "Detection failed.");
        status.textContent = currentFile.name;
      } finally {
        detectButton.disabled = false;
      }
    }

    function toggleMaximized() {
      const on = document.body.classList.toggle("maximized");
      maximizeButton.textContent = on ? "Close" : "Maximize";
      requestAnimationFrame(() => {
        drawOverlays();
        if (activeIndex !== null) revealJson(activeIndex);
      });
    }

    function renderJson() {
      if (!lastData) {
        json.textContent = "";
        return;
      }
      if (!debugInput.checked) {
        json.textContent = JSON.stringify(lastData, null, 2);
        return;
      }
      const entries = boxes.map((box, index) => {
        const block = JSON.stringify(box, null, 2)
          .split("\n")
          .map((line) => "    " + escapeHtml(line))
          .join("\n");
        const active = index === activeIndex ? " active" : "";
        return `<span class="json-box${active}" data-index="${index}">${block}</span>`;
      });
      const body = entries.join(",\n");
      json.innerHTML = `{\n  &quot;boxes&quot;: [\n${body}\n  ]\n}`;
    }

    function setActive(index) {
      activeIndex = index;
      json.querySelectorAll(".json-box").forEach((entry) => {
        entry.classList.toggle("active", Number(entry.dataset.index) === index);
      });
      document.querySelectorAll(".overlay rect").forEach((rect) => {
        rect.classList.toggle("active", Number(rect.dataset.index) === index);
      });
      if (index !== null) revealJson(index);
      zoomToActive();
    }

    function revealJson(index) {
      const entry = json.querySelector(`.json-box[data-index="${index}"]`);
      if (!entry) return;
      const entryRect = entry.getBoundingClientRect();
      const pane = json.getBoundingClientRect();
      if (entryRect.top < pane.top || entryRect.bottom > pane.bottom) {
        json.scrollTop += entryRect.top - pane.top - 12;
      }
    }

    function zoomToActive() {
      if (activeIndex === null || !debugInput.checked || !thumb.naturalWidth) {
        thumbZoom.style.transform = "";
        return;
      }
      const [x1, y1, x2, y2] = boxes[activeIndex].bbox;
      const boundsW = thumb.offsetWidth;
      const boundsH = thumb.offsetHeight;
      if (boundsW < 2 || boundsH < 2) return;
      const fit = Math.min(boundsW / thumb.naturalWidth, boundsH / thumb.naturalHeight);
      const drawnW = thumb.naturalWidth * fit;
      const drawnH = thumb.naturalHeight * fit;
      const cx = thumb.offsetLeft + (boundsW - drawnW) / 2 + ((x1 + x2) / 2) * fit;
      const cy = thumb.offsetTop + (boundsH - drawnH) / 2 + ((y1 + y2) / 2) * fit;
      const boxSize = Math.max((x2 - x1) * fit, (y2 - y1) * fit, 8);
      const amount = Math.max(2, Math.min((Math.min(thumbStage.clientWidth, thumbStage.clientHeight) * 0.42) / boxSize, 8));
      thumbZoom.style.transform = `translate(${thumbStage.clientWidth / 2 - cx * amount}px, ${thumbStage.clientHeight / 2 - cy * amount}px) scale(${amount})`;
    }

    function drawOverlays() {
      placeOverlay(thumb, thumbOverlay);
      zoomToActive();
    }

    function placeOverlay(img, svg) {
      svg.replaceChildren();
      if (!debugInput.checked || !boxes.length || !img.naturalWidth) return;
      const boundsW = img.offsetWidth;
      const boundsH = img.offsetHeight;
      if (boundsW < 2 || boundsH < 2) return;
      const scale = Math.min(boundsW / img.naturalWidth, boundsH / img.naturalHeight);
      const width = img.naturalWidth * scale;
      const height = img.naturalHeight * scale;
      svg.style.left = `${img.offsetLeft + (boundsW - width) / 2}px`;
      svg.style.top = `${img.offsetTop + (boundsH - height) / 2}px`;
      svg.style.width = `${width}px`;
      svg.style.height = `${height}px`;
      svg.setAttribute("viewBox", `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
      boxes.forEach((box, index) => {
        const [x1, y1, x2, y2] = box.bbox;
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", x1);
        rect.setAttribute("y", y1);
        rect.setAttribute("width", Math.max(0, x2 - x1));
        rect.setAttribute("height", Math.max(0, y2 - y1));
        rect.dataset.index = String(index);
        rect.classList.add(box.is_checked ? "checked" : "empty");
        if (index === activeIndex) rect.classList.add("active");
        rect.addEventListener("mouseenter", () => setActive(index));
        svg.appendChild(rect);
      });
    }

    function escapeHtml(value) {
      return value.replace(/[&<>]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[char]));
    }

    function showError(message) {
      error.hidden = false;
      error.textContent = message;
    }

    function clearError() {
      error.hidden = true;
      error.textContent = "";
    }
  </script>
</body>
</html>
